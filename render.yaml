services:
  - type: web
    name: diet-analyze-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot.telegram_bot:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: /opt/render/project/src
    plan: free
    region: singapore
